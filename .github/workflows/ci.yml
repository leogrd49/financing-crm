name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lwc:
    name: LWC — lint + Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit -- --coverage

  web:
    name: Formulaire web — lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  salesforce:
    name: Salesforce — tests Apex + déploiement
    needs: [lwc, web]
    # Le secret donne un accès admin à l'org : seul le code de main est déployé.
    # Les pull requests ne reçoivent jamais le secret (lint, Jest et build seulement).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Secret stocké dans l'environnement GitHub "salesforce-org", restreint à la branche main
    environment: salesforce-org
    env:
      SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Secret SF_AUTH_URL absent
        if: env.SF_AUTH_URL == ''
        run: 'echo "::warning::Secret SF_AUTH_URL non configuré, déploiement Salesforce ignoré."'

      - uses: actions/setup-node@v4
        if: env.SF_AUTH_URL != ''
        with:
          node-version: 22

      # Version figée : pas de mise à jour silencieuse d'un outil qui manipule le secret
      - name: Installer la CLI Salesforce
        if: env.SF_AUTH_URL != ''
        run: npm install --global @salesforce/cli@2.153.5

      - name: Se connecter à l'org
        if: env.SF_AUTH_URL != ''
        run: |
          echo "$SF_AUTH_URL" > "$RUNNER_TEMP/auth-url.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/auth-url.txt" --alias ci --set-default
          rm "$RUNNER_TEMP/auth-url.txt"

      - name: Déployer avec les tests Apex
        if: env.SF_AUTH_URL != ''
        run: sf project deploy start --source-dir force-app --test-level RunLocalTests --coverage-formatters text --wait 30
